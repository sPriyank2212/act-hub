<style>
:root{color-scheme:dark}

button{width:100%;font:inherit;font-weight:700;font-size:17px;padding:13px;border-radius:10px;border:0;background:#19C3B1;color:#0B1F33;cursor:pointer}
button[disabled]{opacity:.6}

</style>

var KEY="act_hub_unlock_v1";
function bytes(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function decrypt(pw){
  var raw=bytes(B64),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28),enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  return new TextDecoder().decode(pt);
}
async function unlock(pw,remember,silent){
  var msg=document.getElementById('msg'),go=document.getElementById('go');
  if(!window.crypto||!crypto.subtle){msg.textContent='This page must be opened over HTTPS.';return;}
  go.disabled=true;msg.style.color='#93A8B8';msg.textContent=silent?'':'Unlocking…';
  try{
    var html=await decrypt(pw.trim());
    try{if(remember)localStorage.setItem(KEY,pw.trim());}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    go.disabled=false;msg.style.color='#FF8A80';
    try{localStorage.removeItem(KEY);}catch(x){}
    msg.textContent=silent?'':'That passphrase is not right.';
  }
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();unlock(document.getElementById('pw').value,document.getElementById('rem').checked,false);});
try{var saved=localStorage.getItem(KEY);if(saved){document.getElementById('rem').checked=true;unlock(saved,true,true);}}catch(e){}
